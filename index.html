<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Autograph Gold — QR Menu</title>

<style>
:root{
--bg:#0b0b0b;
--gold:#c9b27c;
--text:#f5f5f5;
--muted:#bdbdbd;
--line:#2a2a2a;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
padding:16px;
text-align:center;
border-bottom:2px solid var(--gold);
}

h1{
margin:0;
letter-spacing:3px;
color:var(--gold);
}

.top{
margin-top:10px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.chip{
border:1px solid var(--gold);
background:#000;
color:var(--gold);
padding:6px 10px;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.chip.active{
background:var(--gold);
color:#000;
}

.wrap{
max-width:950px;
margin:auto;
padding:16px 16px 200px;
}

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:10px;
}

.search{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid var(--line);
background:#111;
color:#fff;
}

.select{
padding:10px;
border-radius:10px;
background:#111;
color:#fff;
border:1px solid var(--line);
}

.tabs{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap;
}

.tab{
border:1px solid var(--gold);
background:transparent;
color:var(--gold);
padding:8px 10px;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.tab.active{
background:var(--gold);
color:#000;
}

.category{
margin:22px 0;
}

.category h2{
color:var(--gold);
border-bottom:1px solid var(--gold);
padding-bottom:4px;
}

.item{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px dashed #333;
gap:10px;
}

.controls{
display:flex;
align-items:center;
gap:6px;
}

.btn{
width:30px;
height:30px;
border-radius:8px;
border:1px solid var(--gold);
background:#000;
color:var(--gold);
cursor:pointer;
font-weight:bold;
}

.qty{
min-width:20px;
text-align:center;
font-weight:bold;
}

.cart{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-top:2px solid var(--gold);
padding:12px;
}

.total{
color:var(--gold);
font-weight:bold;
margin-top:5px;
}

.action{
padding:8px 12px;
border-radius:8px;
border:none;
cursor:pointer;
font-weight:bold;
margin-top:6px;
}

.send{background:var(--gold);color:#000;}
.clear{background:#3a0b0b;color:#fff;}
.copy{background:#222;color:#fff;}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
}

.modal-box{
background:#111;
border:1px solid var(--gold);
padding:15px;
border-radius:12px;
max-width:400px;
width:90%;
}

pre{
white-space:pre-wrap;
color:#fff;
}
</style>
</head>

<body>

<header>
<h1>AUTOGRAPH GOLD</h1>

<div class="top">
<button class="chip active" onclick="setLang('ru')">RU</button>
<button class="chip" onclick="setLang('kz')">KZ</button>
<button class="chip" onclick="setLang('en')">EN</button>
</div>
</header>

<div class="wrap">

<div class="toolbar">

<input id="search" class="search" placeholder="Поиск..." oninput="render()">

<select id="vip" class="select">
<option>Boss</option>
<option>Author</option>
<option>Green</option>
<option>Luxor</option>
<option>Panorama</option>
</select>

</div>

<div class="tabs">
<button class="tab active" onclick="setSection('all')">Всё</button>
<button class="tab" onclick="setSection('food')">Кухня</button>
<button class="tab" onclick="setSection('bar')">Бар</button>
<button class="tab" onclick="setSection('hookah')">Кальян</button>
</div>

<div id="menu"></div>

</div>

<div class="cart">

<div id="cartItems">Корзина пуста</div>

<label>
<input type="checkbox" id="svc" checked onchange="updateCart()">
Сервис 10%
</label>

<div class="total" id="total">Итого: 0 ₸</div>

<button class="action clear" onclick="clearCart()">Очистить</button>
<button class="action copy" onclick="showOrder()">Показать заказ</button>
<button class="action send" onclick="sendWA()">WhatsApp</button>

</div>

<div class="modal" id="modal">
<div class="modal-box">
<pre id="orderText"></pre>
<button class="action copy" onclick="copyText()">Копировать</button>
<button class="action clear" onclick="hideModal()">Закрыть</button>
</div>
</div>

<script>

const WA_PHONE="77777785757";

let lang="ru";
let section="all";
let cart={};

const DATA={

food:[
{name:"Супы",items:[
["Крем-суп из чечевицы",2260],
["Рамен с курицей",4660],
["Рамен с говядиной",5990],
["Том ям",5990],
["Шорпа с баранины",4290],
["Кеспе с кониной",4290]
]},

{name:"Салаты",items:[
["Салат Баварский",4960],
["Хрустящие баклажаны",4990],
["Цезарь с курицей",5690],
["Цезарь с креветками",5690],
["Цезарь с лососем",5690],
["Тёплый салат с лососем",5990],
["Салат с рукколой и креветками",6290],
["Салат с ростбифом",5290],
["Оливье с семгой",4400]
]},

{name:"Паста",items:[
["Паста болоньезе",4990],
["Паста карбонара",4790],
["Паста с морепродуктами",5790],
["Фетучини альфредо",4790]
]},

{name:"Закуски",items:[
["Баклажан с куртом",4990],
["Винная тарелка",11990],
["Мини чебуреки",2990],
["Самса",2990],
["Хлебная корзина",1990],
["Бауырсаки",1990]
]},

{name:"Предзаказ",items:[
["Запеченная семга целиком",139990],
["Мясо барашка с картофелем",44990],
["Томленные ребра говядины",44990],
["Запеченная ножка ягненка",48990],
["Куырдак",49990],
["Бешбармак",65000]
]}
],

hookah:[
{ name:"Кальяны", items:[
["Lite",10000],
["Hard",15000],
["Замена чаши",7500]
]}
],

bar:[

{name:"Безалкогольные",items:[
["ASU 0.5",1990],
["Cola 0.25",1690],
["Schweppes",2590],
["Red Bull",2590],
["Сок",2990]
]},

{name:"Пиво",items:[
["Corona",2990],
["Miller",2590],
["Heineken разлив",2390],
["Bud разлив",2990]
]},

{name:"Водка",items:[
["Absolut",2690],
["Grey Goose",3290],
["Beluga",3290],
["Belvedere",3490]
]},

{name:"Виски",items:[
["Jameson",2990],
["Jack Daniels",2990],
["Jim Beam",2990],
["Chivas 12",3990],
["Chivas 18",7690],
["Macallan 12",7990]
]},

{name:"Джин",items:[
["Beefeater",2990],
["Beefeater Blackberry",2990],
["Beefeater Blood Orange",2990]
]},

{name:"Текила",items:[
["Olmeca Blanco",2590],
["Olmeca Gold",2590],
["Avion",2990]
]},

{name:"Коньяк",items:[
["Ararat 5",2290],
["Ararat 7",3990],
["Akhtamar 10",4190],
["Hennessy VS",3990],
["Hennessy VSOP",5890],
["Hennessy XO",11990]
]},

{name:"Вино",items:[
["Casasole",19990],
["San Valentin",23990],
["Nuala",33990],
["Jacobs Creek",14990]
]},

{name:"Игристое",items:[
["Martini Asti",19000],
["Martini Prosecco",19000],
["Moet Imperial",116000],
["Moet Rose",96000],
["Bottega",29000]
]}

]

};

function setSection(s){
section=s;
render();
}

function add(name,price){
if(!cart[name]) cart[name]={price,qty:0};
cart[name].qty++;
updateCart();
render();
}

function sub(name){
if(!cart[name]) return;
cart[name].qty--;
if(cart[name].qty<=0) delete cart[name];
updateCart();
render();
}

function clearCart(){
cart={};
updateCart();
render();
}

function render(){

let root=document.getElementById("menu");
root.innerHTML="";

let blocks=[];

if(section==="all") blocks=[...DATA.food,...DATA.bar,...DATA.hookah];
if(section==="food") blocks=DATA.food;
if(section==="bar") blocks=DATA.bar;
if(section==="hookah") blocks=DATA.hookah;

let q=document.getElementById("search").value.toLowerCase();

blocks.forEach(cat=>{

let div=document.createElement("div");
div.className="category";
div.innerHTML=`<h2>${cat.name}</h2>`;

cat.items.forEach(([name,price])=>{

if(q && !name.toLowerCase().includes(q)) return;

let row=document.createElement("div");
row.className="item";

row.innerHTML=`
<div>${name} — ${price} ₸</div>
<div class="controls">
<button class="btn" onclick="sub('${name}')">-</button>
<div class="qty">${cart[name]?.qty||0}</div>
<button class="btn" onclick="add('${name}',${price})">+</button>
</div>
`;

div.appendChild(row);

});

root.appendChild(div);

});

}

function updateCart(){

let entries=Object.entries(cart);

if(!entries.length){
cartItems.innerHTML="Корзина пуста";
total.innerHTML="Итого: 0 ₸";
return;
}

let sum=0;
let html="";

entries.forEach(([name,it])=>{
let line=it.price*it.qty;
sum+=line;
html+=`${name} ×${it.qty} — ${line} ₸<br>`;
});

let svc=document.getElementById("svc").checked?Math.round(sum*0.10):0;
let totalSum=sum+svc;

cartItems.innerHTML=html;
total.innerHTML=`Итого: ${totalSum} ₸`;

}

function buildText(){

let vip=document.getElementById("vip").value;
let entries=Object.entries(cart);

if(!entries.length) return "";

let text=`AUTOGRAPH GOLD\nVIP: ${vip}\n\n`;

let sum=0;

entries.forEach(([name,it])=>{
let line=it.price*it.qty;
sum+=line;
text+=`${name} ×${it.qty} — ${line} ₸\n`;
});

let svc=document.getElementById("svc").checked?Math.round(sum*0.10):0;
let total=sum+svc;

text+=`\nСумма: ${sum} ₸`;
text+=`\nСервис: ${svc} ₸`;
text+=`\nИтого: ${total} ₸`;

return text;
}

function showOrder(){
let t=buildText();
orderText.textContent=t;
modal.style.display="flex";
}

function hideModal(){
modal.style.display="none";
}

function copyText(){
navigator.clipboard.writeText(orderText.textContent);
alert("Скопировано");
}

function sendWA(){

let text=buildText();
if(!text) return;

window.open(`https://wa.me/${WA_PHONE}?text=${encodeURIComponent(text)}`);

}

render();

</script>

</body>
</html>
