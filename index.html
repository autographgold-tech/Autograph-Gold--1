  <meta name="viewport" content="width=device-width, initial-scale=1" />

    :root{--bg:#0b0b0b;--gold:#c9b27c;--text:#f5f5f5;--muted:#bdbdbd;--line:#2a2a2a}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:16px 14px;text-align:center;border-bottom:2px solid var(--gold)}
    h1{margin:0;letter-spacing:3px;color:var(--gold);font-size:22px}
    .top{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
    .chip{border:1px solid var(--gold);background:#000;color:var(--gold);padding:6px 10px;border-radius:10px;cursor:pointer;font-weight:700}
    .chip.active{background:var(--gold);color:#000}

    .wrap{max-width:980px;margin:0 auto;padding:16px 14px calc(210px + env(safe-area-inset-bottom,0px))}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0 14px}
    .search{flex:1;min-width:220px;max-width:520px;background:#0f0f0f;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:12px;outline:none}
    .vipSel{min-width:200px;background:#0f0f0f;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:12px;outline:none}

    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:700}
    .tab.active{background:var(--gold);color:#000}

    .category{margin:22px 0}
    .category h2{margin:0 0 10px;color:var(--gold);border-bottom:1px solid var(--gold);padding-bottom:6px;font-size:18px}

    .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
    .iname{font-size:14px;line-height:1.25}
    .iprice{color:var(--muted);font-size:13px;margin-left:8px;white-space:nowrap}
    .controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--gold);background:#000;color:var(--gold);font-size:18px;cursor:pointer}
    .qty{min-width:18px;text-align:center;font-weight:900}

    .cart{position:fixed;left:0;right:0;bottom:0;background:rgba(17,17,17,.96);border-top:2px solid var(--gold);padding:12px 14px;backdrop-filter:blur(6px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
    .cart-inner{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
    .cart-left{min-width:240px;flex:1}
    .cart-title{color:var(--muted);font-size:12px;margin-bottom:6px}
    .cart-items{font-size:13px;line-height:1.35;max-height:90px;overflow:auto;padding-right:6px}
    .cart-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .total{color:var(--gold);font-size:16px;font-weight:900}
    .small{color:var(--muted);font-size:12px}
    .svc{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
    .svc input{transform:scale(1.1)}
    .action{padding:10px 12px;border-radius:12px;border:none;font-weight:900;cursor:pointer}
    .clear{background:#3a0b0b;color:#fff}
    .copy{background:#1a1a1a;color:var(--gold);border:1px solid var(--gold)}
    .send{background:var(--gold);color:#000}

    .mb{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:14px}
    .modal{max-width:720px;width:100%;background:#0f0f0f;border:1px solid var(--gold);border-radius:16px;padding:14px}
    .modal h3{margin:0 0 10px;color:var(--gold);letter-spacing:1px}
    .modal pre{white-space:pre-wrap;word-break:break-word;background:#0b0b0b;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text);font-size:13px}
    .m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
    .close{background:#222;color:#fff;border:1px solid #444}

    /* ===== PARTY UI ===== */
    .partyBtn{
      border:1px solid var(--gold);
      background:#000;
      color:var(--gold);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:900;
    }
    .partyBtn:hover{filter:brightness(1.08)}

    .partyRow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin:10px 0}
    .partyRow label{color:var(--muted);font-size:12px}
    .partyRow select{
      min-width:190px;background:#0f0f0f;border:1px solid var(--line);color:var(--text);
      padding:10px 12px;border-radius:12px;outline:none
    }
    .partyNum{display:flex;gap:8px;align-items:center}
    .partyNum button{
      width:36px;height:36px;border-radius:10px;border:1px solid var(--gold);
      background:#000;color:var(--gold);font-size:18px;cursor:pointer
    }
    .partyNum span{min-width:34px;text-align:center;font-weight:900}

    .packGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    @media (max-width:560px){ .packGrid{grid-template-columns:1fr} }
    .pack{
      border:1px solid var(--line);
      background:#0b0b0b;
      border-radius:14px;
      padding:12px;
    }
    .pack.active{border:1px solid var(--gold); box-shadow:0 0 0 1px rgba(201,178,124,.25) inset}
    .pack h4{margin:0 0 6px;color:var(--gold)}
    .pack .pdesc{color:var(--muted);font-size:12px;line-height:1.35;margin:0 0 10px}
    .pack .pprice{color:var(--gold);font-weight:900}
    .pack .pmini{color:var(--muted);font-size:12px;margin-top:6px}
    .pack button{
      margin-top:10px;
      width:100%;
      border-radius:12px;
      border:1px solid var(--gold);
      background:#000;
      color:var(--gold);
      padding:10px 12px;
      cursor:pointer;
      font-weight:900;
    }
    .pack button:hover{filter:brightness(1.08)}
    .partySmall{color:var(--muted);font-size:12px;line-height:1.35;margin-top:10px}
  </style>
</head>

<header>
  <h1>AUTOGRAPH GOLD</h1>
  <div class="top">
    <button class="chip active" data-lang="ru">RU</button>
    <button class="chip" data-lang="kz">KZ</button>
    <button class="chip" data-lang="en">EN</button>
  </div>
</header>

<div class="wrap">

    <input id="q" class="search" placeholder="Поиск по меню..." />

      <button class="tab" data-section="food">Кухня</button>
      <button class="tab" data-section="bar">Бар</button>
      <button class="tab" data-section="hookah">Кальян</button>
    </div>

    <button class="partyBtn" id="partyBtn">Праздник 🎉</button>
  </div>

  <div id="menu"></div>
</div>

<div class="cart">
  <div class="cart-inner">
    <div class="cart-left">
      <div class="cart-title" id="cartTitle">Выбрано:</div>
      <div class="cart-items" id="cartItems">Корзина пуста</div>
    </div>
    <div class="cart-right">
      <label class="svc"><input id="svc" type="checkbox" checked /> <span id="svcLabel">Сервис 10%</span></label>
      <div>
        <div class="total" id="total">Итого: 0 ₸</div>
        <div class="small" id="breakdown"></div>
      </div>
      <button class="action clear" id="clearBtn">Очистить</button>
      <button class="action copy" id="copyBtn">Показать заказ</button>
      <button class="action send" id="sendBtn">Отправить на WhatsApp</button>
    </div>
  </div>
</div>

<!-- Order modal -->
<div class="mb" id="mb">
  <div class="modal">
    <h3 id="mTitle">Заказ</h3>
    <pre id="orderText"></pre>
    <div class="m-actions">
      <button class="action copy" id="mCopy">Скопировать</button>
      <button class="action close" id="mClose">Закрыть</button>
    </div>
  </div>
</div>

<!-- Party modal -->
<div class="mb" id="partyMb">
  <div class="modal">
    <h3 id="pTitle">Праздник</h3>

    <div class="partyRow">
      <div>
        <label id="pVipLabel">VIP</label><br>
        <select id="pVip"></select>
      </div>

      <div>
        <label id="pTypeLabel">Повод</label><br>
        <select id="pType"></select>
      </div>

      <div>
        <label id="pGuestsLabel">Гостей</label><br>
        <div class="partyNum">
          <button id="gMinus" type="button">−</button>
          <span id="gVal">10</span>
          <button id="gPlus" type="button">+</button>
        </div>
      </div>
    </div>

    <div class="packGrid" id="pPacks"></div>

    <div class="m-actions">
      <button class="action copy" id="pShow">Показать</button>
      <button class="action copy" id="pCopy">Скопировать</button>
      <button class="action send" id="pSend">Отправить в WhatsApp</button>
      <button class="action close" id="pClose">Закрыть</button>
    </div>

    <div class="partySmall" id="pHint"></div>
    <pre id="pText" style="display:none;margin-top:10px"></pre>
  </div>
</div>

  function add(name, price){
    if(!cart[name]) cart[name]={price, qty:0};
    cart[name].qty++;
    updateCart(); refreshQty();
  }
  function sub(name){
    if(!cart[name]) return;
    cart[name].qty--;
    if(cart[name].qty<=0) delete cart[name];
    updateCart(); refreshQty();
  }
  function clearCart(){ cart={}; updateCart(); refreshQty(); }

  // safe blocks() to avoid crashes if some section is null
  function blocks(){
    const d = DATA[lang];
    const out=[];
    const food = Array.isArray(d.food) ? d.food : [];
    const bar  = Array.isArray(d.bar) ? d.bar : [];
    const hook = Array.isArray(d.hookah) ? d.hookah : [];

    if(section==='all'||section==='food') out.push(...food);
    if(section==='all'||section==='bar') out.push(...bar);
    if(section==='all'||section==='hookah') out.push(...hook);
    return out;
  }

  function render(){
    const q = ($('q').value||'').trim().toLowerCase();
    const root = $('menu');
    root.innerHTML='';

    for(const cat of blocks()){
      const items = cat.items.filter(([n]) => !q || n.toLowerCase().includes(q));
      if(!items.length) continue;

      const wrap = document.createElement('div');
      wrap.className='category';
      const h2=document.createElement('h2');
      h2.textContent=cat.name;
      wrap.appendChild(h2);

      for(const [name, price] of items){
        const row=document.createElement('div');
        row.className='item';

        const left=document.createElement('div');
        left.className='iname';
        left.textContent=name;

        const ps=document.createElement('span');
        ps.className='iprice';
        ps.textContent = fmt(price)+' ₸';
        left.appendChild(ps);

        const ctr=document.createElement('div');
        ctr.className='controls';

        const bSub=document.createElement('button');
        bSub.className='btn';
        bSub.textContent='−';
        bSub.dataset.action='sub';
        bSub.dataset.name=name;

        const qty=document.createElement('div');
        qty.className='qty';
        qty.dataset.qty=name;
        qty.textContent=String(cart[name]?.qty||0);

        const bAdd=document.createElement('button');
        bAdd.className='btn';
        bAdd.textContent='+';
        bAdd.dataset.action='add';
        bAdd.dataset.name=name;
        bAdd.dataset.price=String(price);

        ctr.appendChild(bSub); ctr.appendChild(qty); ctr.appendChild(bAdd);
        row.appendChild(left); row.appendChild(ctr);
        wrap.appendChild(row);
      }
      root.appendChild(wrap);
    }
  }

  function refreshQty(){
    document.querySelectorAll('[data-qty]').forEach(el=>{
      const name=el.dataset.qty;
      el.textContent=String(cart[name]?.qty||0);
    });
  }

  function updateCart(){
    const entries = Object.entries(cart);
    if(!entries.length){
      $('cartItems').textContent=ui().empty;
      $('total').textContent=ui().total+': 0 ₸';
      $('breakdown').textContent='';
      return;
    }
    let sum=0, html='';
    for(const [name, it] of entries){
      const line=it.price*it.qty;
      sum+=line;
      html += `${name} ×${it.qty} — ${fmt(line)} ₸<br>`;
    }
    const svcOn = $('svc').checked;
    const svc = svcOn ? Math.round(sum*0.10) : 0;
    const total = sum + svc;

    $('cartItems').innerHTML=html;
    $('total').textContent=ui().total+': '+fmt(total)+' ₸';
    $('breakdown').textContent = svcOn
      ? `${ui().sum}: ${fmt(sum)} ₸ + ${ui().svcLine}: ${fmt(svc)} ₸`
      : `${ui().sum}: ${fmt(sum)} ₸ (${ui().svcOff})`;
  }

  function orderText(){
    const entries=Object.entries(cart);
    if(!entries.length) return '';

    const vipVal = $('vip').value || '';
    const vipText = VIPS.find(v=>v.val===vipVal) || VIPS[0];
    const vipLabel = (lang==='ru'?vipText.ru:(lang==='kz'?vipText.kz:vipText.en));

    const svcOn=$('svc').checked;
    let sum=0;

    let t=`AUTOGRAPH GOLD — ${ui().modal}\n${ui().vipLabel}: ${vipLabel}\n\n`;

    for(const [name, it] of entries){
      const line=it.price*it.qty;
      sum+=line;
      t += `• ${name} ×${it.qty} — ${fmt(line)} ₸\n`;
    }

    const svc=svcOn?Math.round(sum*0.10):0;
    const total=sum+svc;

    t += `\n${ui().sum}: ${fmt(sum)} ₸\n`;
    t += svcOn ? `${ui().svcLine}: ${fmt(svc)} ₸\n` : `${ui().svcOff}\n`;
    t += `${ui().total}: ${fmt(total)} ₸\n`;

    return t;
  }

  async function copyOrder(){
    const t=orderText(); if(!t) return;
    try{
      if(navigator.clipboard?.writeText){
        await navigator.clipboard.writeText(t);
        alert(ui().copied);
        return;
      }
    }catch(e){}
    $('orderText').textContent=t;
    showModal();
    try{
      const range=document.createRange();
      range.selectNodeContents($('orderText'));
      const sel=window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges();
      alert(ui().copied);
    }catch(e){}
  }

    for(const s of pack.extra[lang]) lines.push(`• ${s}`);
    lines.push('');
    lines.push(`${ui().partyEst}: ${fmt(est)} ₸`);
    lines.push('');
    lines.push(lang==='ru'
      ? 'Напишите удобное время и дату — менеджер подтвердит бронирование.'
      : (lang==='kz'
          ? 'Күні мен уақытын жазыңыз — менеджер бронды растайды.'
          : 'Send date/time — manager will confirm the booking.'
        )
    );

    return lines.join('\n');
  }

  function showParty(){
    const t = partyText();
    $('pText').style.display = 'block';
    $('pText').textContent = t;
  }

  async function copyParty(){
    const t = partyText();
    try{
      if(navigator.clipboard?.writeText){
        await navigator.clipboard.writeText(t);
        alert(ui().copied);
        return;
      }
    }catch(e){}
    showParty();
    try{
      const range=document.createRange();
      range.selectNodeContents($('pText'));
      const sel=window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges();
      alert(ui().copied);
    }catch(e){}
  }

  function openParty(){
    fillVip('pVip');
    fillPartyTypes();
    $('pVip').value = $('vip').value || VIPS[0].val;
    $('pType').value = partyType;
    $('gVal').textContent = String(partyGuests);
    renderPartyPacks();
    $('pText').style.display = 'none';
    $('partyMb').style.display = 'flex';
  }
  function closeParty(){
    $('partyMb').style.display = 'none';
  }

  // ===== EVENTS =====
  document.addEventListener('click',(e)=>{
    const t=e.target;

    if(t.matches('[data-lang]')) return setLang(t.dataset.lang);
    if(t.matches('[data-section]')) return setSection(t.dataset.section);

    if(t.dataset.action){
      const name=t.dataset.name;
      if(t.dataset.action==='add') return add(name, Number(t.dataset.price||0));
      return sub(name);
    }

    if(t.id==='clearBtn') return clearCart();
    if(t.id==='copyBtn') return showModal();
    if(t.id==='sendBtn') return sendWA();

    if(t.id==='mCopy') return copyOrder();
    if(t.id==='mClose' || t.id==='mb') return hideModal();

    // party open/close
    if(t.id==='partyBtn') return openParty();
    if(t.id==='pClose') return closeParty();
    if(t.id==='partyMb') return closeParty();

    // guests +/-
    if(t.id==='gMinus'){
      partyGuests = Math.max(1, partyGuests - 1);
      renderPartyPacks();
      return;
    }
    if(t.id==='gPlus'){
      partyGuests = Math.min(80, partyGuests + 1);
      renderPartyPacks();
      return;
    }

    // pick pack
    if(t.dataset.pack){
      partyPack = t.dataset.pack;
      renderPartyPacks();
      return;
    }

    if(t.id==='pShow') return showParty();
    if(t.id==='pCopy') return copyParty();
    if(t.id==='pSend') return sendWA(partyText());
  });

  $('q').addEventListener('input', render);
  $('svc').addEventListener('change', updateCart);

  $('pVip').addEventListener('change', ()=>{ /* keep state in UI */ });
  $('pType').addEventListener('change', (e)=>{
    partyType = e.target.value;
  });

  // init
  setLang('ru');
  setSection('all');
</script>
</body>
</html>
